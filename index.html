<!DOCTYPE html>
<html lang="it">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>costante</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#12151A; --bg2:#1A1F27; --bg3:#242A34; --line:#2C333E;
    --text:#ECE9E1; --muted:#8A93A0; --gold:#E1B15A;
    --read:#E1B15A; --think:#AFA0E6; --python:#79C58C; --diet:#66B8C2; --gym:#E58A7B;
    --r-lg:20px; --r-md:16px; --r-sm:10px;
    --elev: inset 0 1px 0 rgba(255,255,255,.045), 0 1px 2px rgba(0,0,0,.32), 0 6px 16px rgba(0,0,0,.20);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap{max-width:440px;margin:0 auto;padding:22px 18px 104px;}
  button{font:inherit;}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .brand{font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;}
  .brand .p{color:var(--python);}
  .streak{display:flex;align-items:center;gap:7px;background:var(--bg2);box-shadow:var(--elev);padding:8px 13px;border-radius:100px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;}
  .streak svg{width:15px;height:16px;display:block;}

  .lvl{background:var(--bg2);box-shadow:var(--elev);border-radius:var(--r-md);padding:14px 16px;}
  .lvl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums;}
  .lvl-top b{color:var(--text);font-size:15px;}
  .bar{height:7px;background:var(--bg);border-radius:100px;overflow:hidden;}
  .bar span{display:block;height:100%;background:var(--gold);border-radius:100px;transition:width .35s ease;}

  .week{display:flex;justify-content:space-between;gap:6px;margin:18px 2px;}
  .day{flex:1;text-align:center;}
  .day .lab{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .day .cell{height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;}
  .day .cell.on{background:var(--bg3);}
  .day .cell.full{background:rgba(225,177,90,.15);}
  .day.today .cell{box-shadow:inset 0 0 0 1.5px var(--muted);}
  .day .cell .m{width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .day .cell.full .m{background:var(--gold);}

  .h{font-size:13px;color:var(--muted);margin:24px 2px 12px;display:flex;justify-content:space-between;align-items:baseline;}
  .h .date{color:var(--text);}

  .card{background:var(--bg2);box-shadow:var(--elev);border-radius:var(--r-md);padding:16px;margin-bottom:11px;display:flex;gap:13px;align-items:flex-start;transition:opacity .2s ease;}
  .card.done{opacity:.5;}
  .tick{flex:0 0 auto;width:27px;height:27px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;margin-top:2px;position:relative;padding:0;transition:background-color .18s ease,border-color .18s ease,transform .1s ease;}
  .tick:active{transform:scale(.94);}
  .tick.read{border-color:var(--read);} .tick.think{border-color:var(--think);} .tick.python{border-color:var(--python);} .tick.diet{border-color:var(--diet);} .tick.gym{border-color:var(--gym);}
  .tick.on::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(43deg);}
  .tick.on.read{background:var(--read);} .tick.on.think{background:var(--think);} .tick.on.python{background:var(--python);} .tick.on.diet{background:var(--diet);} .tick.on.gym{background:var(--gym);}
  .body{flex:1;min-width:0;}
  .tag{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.25;font-variant-numeric:tabular-nums;}
  .tag.read{color:var(--read);} .tag.think{color:var(--think);} .tag.python{color:var(--python);} .tag.diet{color:var(--diet);} .tag.gym{color:var(--gym);}
  .task{font-size:15px;text-wrap:pretty;}
  .sub{font-size:13.5px;color:var(--muted);margin-top:4px;text-wrap:pretty;}
  .sub b{color:var(--text);font-weight:600;}
  .nudge{font-size:12.5px;color:var(--gold);margin-top:7px;font-variant-numeric:tabular-nums;}
  .pyok{color:var(--python);font-weight:700;}
  .pydone{font-size:12.5px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums;}
  .undo{background:none;border:none;color:var(--gold);font:inherit;font-size:12.5px;cursor:pointer;padding:0 0 0 8px;text-decoration:underline;}
  .solbtn{background:none;border:1px solid var(--line);color:var(--python);font:inherit;font-size:13px;font-weight:600;border-radius:100px;padding:7px 14px;margin-top:12px;cursor:pointer;transition:transform .1s ease,border-color .15s ease;}
  .solbtn:active{transform:scale(.96);}
  .solbtn:hover{border-color:var(--python);}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin-top:11px;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre;color:var(--text);tab-size:4;}
  .code[hidden]{display:none;}

  .pagerow{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .pagerow label{font-size:13.5px;color:var(--muted);}
  .pages{width:74px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font:inherit;font-size:16px;padding:8px 10px;text-align:center;font-variant-numeric:tabular-nums;transition:border-color .15s ease;}
  .pages:focus{outline:none;border-color:var(--gold);}
  .note{width:100%;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font:inherit;font-size:16px;line-height:1.5;padding:10px 11px;resize:none;overflow:hidden;transition:border-color .15s ease;}
  .note::placeholder{color:var(--muted);}
  .note:focus{outline:none;border-color:var(--gold);}
  .facolt{font-size:11.5px;color:var(--muted);margin-top:6px;text-wrap:pretty;}

  .pieno{background:rgba(121,197,140,.12);border:1px solid var(--python);color:var(--python);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;font-weight:600;text-align:center;margin-bottom:11px;text-wrap:balance;}

  .pyprog{background:var(--bg2);box-shadow:var(--elev);border-radius:var(--r-md);padding:14px 16px;margin-top:15px;}
  .pyprog .r{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums;}
  .pyprog .r b{color:var(--python);}
  .pyprog .bar span{background:var(--python);}

  .ach{margin-top:24px;}
  .ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  .badge{background:var(--bg2);border-radius:12px;padding:12px 13px;opacity:.45;transition:opacity .2s ease;}
  .badge.got{opacity:1;box-shadow:inset 0 0 0 1px var(--gold);}
  .badge .n{font-size:14px;font-weight:600;}
  .badge .dsc{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;text-wrap:pretty;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 16px;}
  .cal-title{font-size:17px;font-weight:600;text-wrap:balance;}
  .cal-nav{background:var(--bg2);box-shadow:var(--elev);color:var(--text);border:none;width:38px;height:38px;border-radius:11px;font-size:19px;cursor:pointer;transition:transform .1s ease;}
  .cal-nav:active{transform:scale(.94);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px;}
  .cal-day{aspect-ratio:1;border-radius:9px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:13.5px;font-variant-numeric:tabular-nums;transition:transform .1s ease;}
  .cal-day:active{transform:scale(.94);}
  .cal-day.empty{background:none;cursor:default;}
  .cal-day.future{opacity:.4;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--muted);}
  .cal-day .dots{display:flex;gap:2px;height:5px;}
  .cal-day .dt{width:5px;height:5px;border-radius:50%;}
  .cal-legend{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:12.5px;color:var(--muted);}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px;}
  .cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .sec-title{font-size:16px;font-weight:700;margin:22px 2px 12px;}
  .sec-title:first-child{margin-top:6px;}
  .up{background:var(--bg2);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;}
  .up .when{flex:0 0 66px;font-size:12.5px;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums;}
  .up .what{flex:1;font-size:14.5px;text-wrap:pretty;}
  .up.next{box-shadow:inset 0 0 0 1px var(--python);}
  .up .step{font-size:12px;color:var(--python);font-weight:600;margin-bottom:3px;font-variant-numeric:tabular-nums;}
  .remaining{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;font-variant-numeric:tabular-nums;}

  .nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(21,25,31,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;}
  .nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .15s ease,transform .1s ease;}
  .nav button:active{transform:scale(.96);}
  .nav button.on{color:var(--gold);}
  .nav svg{width:23px;height:23px;display:block;}

  #modal:empty{display:none;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:var(--bg2);box-shadow:0 -1px 0 rgba(255,255,255,.05),0 -8px 40px rgba(0,0,0,.55);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:440px;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,0,0,1);}
  @keyframes up{from{transform:translateY(24px);opacity:.3;}to{transform:none;opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .sheet-head .t{font-size:16px;font-weight:600;text-wrap:balance;}
  .sheet-head .x{background:var(--bg3);border:none;color:var(--text);width:31px;height:31px;border-radius:50%;font-size:16px;cursor:pointer;transition:transform .1s ease;}
  .sheet-head .x:active{transform:scale(.94);}
  .rc-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .rc-row:last-child{border-bottom:none;}
  .rc-mark{width:13px;height:13px;border-radius:4px;margin-top:3px;flex:0 0 auto;background:var(--bg3);}
  .rc-mark.on.read{background:var(--read);} .rc-mark.on.think{background:var(--think);} .rc-mark.on.python{background:var(--python);}
  .rc-lab{font-weight:700;font-size:14px;margin-bottom:3px;}
  .rc-lab.read{color:var(--read);} .rc-lab.think{color:var(--think);} .rc-lab.python{color:var(--python);}
  .rc-txt{font-size:14px;text-wrap:pretty;}
  .rc-extra{font-size:13px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums;}
  .rc-note{font-size:13.5px;line-height:1.5;background:var(--bg);border-radius:var(--r-sm);padding:9px 11px;margin-top:7px;text-wrap:pretty;}

  .topicons{display:flex;align-items:center;gap:8px;}
  .iconbtn{background:var(--bg2);box-shadow:var(--elev);border:none;color:var(--muted);width:38px;height:38px;border-radius:100px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s ease,color .15s ease;}
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{color:var(--gold);}
  .iconbtn svg{width:18px;height:18px;}
  .resbtn{display:block;width:100%;background:var(--bg2);box-shadow:var(--elev);border:none;color:var(--gold);font:inherit;font-size:14px;font-weight:600;border-radius:var(--r-md);padding:13px;margin-bottom:16px;cursor:pointer;transition:transform .1s ease;}
  .resbtn:active{transform:scale(.98);}
  .overlay.res{align-items:stretch;}
  .respage{background:var(--bg);width:100%;max-width:440px;height:100%;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:fadein .22s ease both;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0;}
  .chip{background:var(--bg3);border:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;border-radius:100px;padding:6px 12px;cursor:pointer;transition:transform .1s ease;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--gold);color:#17130a;}
  .cg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none;-ms-overflow-style:none;}
  .cg-scroll::-webkit-scrollbar{display:none;}
  .anno{margin-top:20px;}
  .anno:first-of-type{margin-top:10px;}
  .anno-tit{font-size:15px;font-weight:700;margin-bottom:9px;font-variant-numeric:tabular-nums;}
  .cg-labels{display:flex;gap:3px;margin-bottom:5px;}
  .cg-m{width:11px;flex:0 0 11px;font-size:10px;line-height:1;color:var(--muted);white-space:nowrap;}
  .cg{display:flex;gap:3px;}
  .cg-col{display:flex;flex-direction:column;gap:3px;}
  .cg-cell{width:11px;height:11px;flex:0 0 11px;border-radius:2px;}
  .cg-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:14px;}
  .cg-leg .lg{width:11px;height:11px;border-radius:2px;display:inline-block;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .view.anim{animation:fadein .28s ease both;}
  @keyframes pop{0%{transform:scale(1);}42%{transform:scale(1.02);}100%{transform:scale(1);}}
  .card.pop{animation:pop .32s ease;}
  @keyframes flame{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.14);opacity:.82;}}
  .streak.live svg{animation:flame 2.6s ease-in-out infinite;transform-origin:50% 90%;}
  @keyframes gridin{from{opacity:0;}to{opacity:1;}}
  .cg,.cg-labels{animation:gridin .3s ease both;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>

<script>
const K="costante_v2";

const PYTHON=[
 {t:"Il primo script",i:"Come scrivere ed eseguire un file Python.",c:"Crea un file prova.py con dentro print('ciao') ed eseguilo.",s:["print('ciao')"]},
 {t:"Le variabili",i:"Salvare un valore dentro un nome per riusarlo.",c:"Crea citta = 'Milano' e stampala con print(citta).",s:["citta = 'Milano'","print(citta)"]},
 {t:"Numeri e testo",i:"La differenza tra un numero e una stringa di testo.",c:"Crea eta = 30 e stampa 'Ho ' + str(eta) + ' anni'.",s:["eta = 30","print('Ho ' + str(eta) + ' anni')"]},
 {t:"Chiedere dati",i:"Leggere qualcosa scritto da chi usa il programma.",c:"Usa nome = input('Come ti chiami? ') e poi salutalo.",s:["nome = input('Come ti chiami? ')","print('Ciao ' + nome)"]},
 {t:"La calcolatrice",i:"Fare operazioni tra numeri presi in input.",c:"Chiedi due numeri e stampa la somma (usa int() sull'input).",s:["a = int(input('Primo numero: '))","b = int(input('Secondo numero: '))","print(a + b)"]},
 {t:"Le condizioni",i:"Far decidere al programma con if.",c:"Chiedi un numero e stampa se è pari o dispari.",s:["n = int(input('Numero: '))","if n % 2 == 0:","    print('pari')","else:","    print('dispari')"]},
 {t:"if, elif, else",i:"Gestire più casi diversi.",c:"Chiedi un voto da 0 a 10 e stampa basso, medio o alto.",s:["voto = int(input('Voto: '))","if voto <= 4:","    print('basso')","elif voto <= 7:","    print('medio')","else:","    print('alto')"]},
 {t:"Vero o falso",i:"I valori booleani e i confronti.",c:"Stampa il risultato di 5 > 3 e di 2 == 4.",s:["print(5 > 3)","print(2 == 4)"]},
 {t:"Ripetere con while",i:"Ripetere qualcosa finché serve.",c:"Stampa i numeri da 1 a 10 usando un ciclo while.",s:["n = 1","while n <= 10:","    print(n)","    n += 1"]},
 {t:"Ripetere con for",i:"Scorrere una sequenza con for e range.",c:"Stampa la tabellina del 7 con un ciclo for.",s:["for i in range(1, 11):","    print(7 * i)"]},
 {t:"Le liste",i:"Tenere più valori insieme in ordine.",c:"Crea una lista di 3 città e stampale una alla volta.",s:["citta = ['Milano', 'Roma', 'Napoli']","for c in citta:","    print(c)"]},
 {t:"Modificare le liste",i:"Aggiungere elementi e contarli.",c:"Parti da lista vuota, aggiungi 3 nomi con append e stampa quanti sono.",s:["nomi = []","nomi.append('Anna')","nomi.append('Luca')","nomi.append('Sara')","print(len(nomi))"]},
 {t:"I dizionari",i:"Collegare una chiave a un valore.",c:"Crea un dizionario con nome ed età di una persona e stampali.",s:["persona = {'nome': 'Anna', 'eta': 30}","print(persona['nome'])","print(persona['eta'])"]},
 {t:"Scorrere un dizionario",i:"Leggere tutte le coppie chiave e valore.",c:"Fai un dizionario di 3 prodotti col prezzo e stampali con un for.",s:["prezzi = {'pane': 2.0, 'latte': 1.5, 'caffe': 3.0}","for prodotto, prezzo in prezzi.items():","    print(prodotto, prezzo)"]},
 {t:"Le funzioni",i:"Dare un nome a un blocco di codice da riusare.",c:"Scrivi una funzione saluta(nome) e chiamala due volte.",s:["def saluta(nome):","    print('Ciao ' + nome)","","saluta('Anna')","saluta('Luca')"]},
 {t:"Restituire un valore",i:"Far tornare un risultato con return.",c:"Scrivi somma(a, b) che restituisce a + b, poi stampa somma(4, 5).",s:["def somma(a, b):","    return a + b","","print(somma(4, 5))"]},
 {t:"Frasi ordinate",i:"Le f-string per unire testo e variabili.",c:"Con eta = 30 stampa f'Ho {eta} anni'.",s:["eta = 30","print(f'Ho {eta} anni')"]},
 {t:"Quando va storto",i:"Gestire gli errori con try ed except.",c:"Chiedi un numero e gestisci il caso in cui scrivono lettere.",s:["try:","    n = int(input('Numero: '))","    print(n * 2)","except ValueError:","    print('Non e un numero')"]},
 {t:"Leggere un file",i:"Aprire e leggere un file di testo.",c:"Crea a mano note.txt, poi leggilo e stampalo dal programma.",s:["f = open('note.txt')","testo = f.read()","f.close()","print(testo)"]},
 {t:"Scrivere un file",i:"Salvare del testo dentro un file.",c:"Scrivi tre righe dentro un file diario.txt dal programma.",s:["f = open('diario.txt', 'w')","f.write('riga uno\\n')","f.write('riga due\\n')","f.write('riga tre\\n')","f.close()"]},
 {t:"Le date",i:"Lavorare con date e orari (modulo datetime).",c:"Stampa la data di oggi con datetime.date.today().",s:["import datetime","print(datetime.date.today())"]},
 {t:"Il caso",i:"Generare numeri casuali (modulo random).",c:"Stampa un numero casuale tra 1 e 100.",s:["import random","print(random.randint(1, 100))"]},

let tab="oggi";

let ultimoTocco=null;
let calMese=new Date(oggi.getFullYear(),oggi.getMonth(),1);

function mezzanotte(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function ymd(d){const m=("0"+(d.getMonth()+1)).slice(-2),g=("0"+d.getDate()).slice(-2);return d.getFullYear()+"-"+m+"-"+g;}
function indiceGiorno(d){const base=new Date(2024,0,1);return Math.round((mezzanotte(d)-base)/86400000);}
function mod(n,m){return ((n%m)+m)%m;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function leggiPer(d){return LEGGI[mod(indiceGiorno(d),LEGGI.length)];}
function ragionaPer(d){return RAGIONA[mod(indiceGiorno(d),RAGIONA.length)];}
function pyStepsOf(h){return h.pySteps || (h.pyStep!==undefined?[h.pyStep]:[]);}
function pyFattiOggi(){return pyStepsOf(stato.history[ymd(oggi)]||{}).length;}

function nuovo(){return {history:{},pythonIndex:0};}
function carica(){try{return Object.assign(nuovo(),JSON.parse(localStorage.getItem(K)));}catch(e){return nuovo();}}
function salva(){try{localStorage.setItem(K,JSON.stringify(stato));}catch(e){}}

function attivo(k){const h=stato.history[k];return !!(h&&(h.read||h.think||pyStepsOf(h).length||h.diet||h.gym));}
function pieno(k){const h=stato.history[k];return !!(h&&h.read&&h.think&&pyStepsOf(h).length&&h.diet&&h.gym);}

function streak(){
  let d=new Date(oggi);
  if(!attivo(ymd(d)))d.setDate(d.getDate()-1);
  let n=0;
  while(attivo(ymd(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function recordStreak(){
  const chiavi=Object.keys(stato.history).filter(attivo).sort();
  let best=0,run=0,prec=null;
  for(const k of chiavi){
    const d=new Date(k);
    if(prec&&Math.round((d-prec)/86400000)===1)run++;else run=1;
    if(run>best)best=run;
    prec=d;
  }
  return Math.max(best,streak());
}
function giorniSenza(track){
  let d=new Date(oggi);
  for(let i=0;i<400;i++){
    const h=stato.history[ymd(d)];
    if(h){const ok = track==="python" ? pyStepsOf(h).length>0 : h[track]; if(ok)return i;}
    d.setDate(d.getDate()-1);
  }
  return null;
}
function totali(){
  let punti=0,think=0,read=0,diet=0,gym=0;
  for(const k in stato.history){
    const h=stato.history[k];
    if(h.read){punti+=10;read++;}
    if(h.think){punti+=10;think++;}
    if(h.diet){punti+=10;diet++;}
    if(h.gym){punti+=10;gym++;}
    const pn=pyStepsOf(h).length; punti+=20*pn;
    if(h.read&&h.think&&pn&&h.diet&&h.gym)punti+=10;
  }
  return {punti,think,read,diet,gym};
}

function toggle(track){
  const k=ymd(oggi);
  if(!stato.history[k])stato.history[k]={};
  stato.history[k][track]=!stato.history[k][track];
  ultimoTocco=track;
  salva();render();
}
function completaPython(){
  if(stato.pythonIndex>=PYTHON.length)return;
  const k=ymd(oggi);
  if(!stato.history[k])stato.history[k]={};
  const h=stato.history[k];
  if(!h.pySteps)h.pySteps=[];
  h.pySteps.push(stato.pythonIndex);
  stato.pythonIndex++;
  ultimoTocco="python";
  salva();render();
}
function annullaPython(){
  const k=ymd(oggi);
  const h=stato.history[k];
  if(!h)return;
  const steps=pyStepsOf(h);
  if(!steps.length)return;
  const last=steps[steps.length-1];
  if(h.pySteps){h.pySteps.pop();if(!h.pySteps.length)delete h.pySteps;}
  else delete h.pyStep;
  stato.pythonIndex=last;
  salva();render();
}

function storicoHTML(){
  const y=calMese.getFullYear(), m=calMese.getMonth();
  const first=new Date(y,m,1);
  const blanks=(first.getDay()+6)%7;
  const giorni=new Date(y,m+1,0).getDate();
  const titolo=cap(calMese.toLocaleDateString("it-IT",{month:"long",year:"numeric"}));
  const wd=["L","M","M","G","V","S","D"];
  let cells=wd.map(w=>`<div class="cal-wd">${w}</div>`).join("");
  for(let i=0;i<blanks;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let g=1;g<=giorni;g++){
    const d=new Date(y,m,g),k=ymd(d),h=stato.history[k]||{};
    const future=mezzanotte(d)>oggi;
    let dots="";
    if(h.read)dots+=`<span class="dt" style="background:var(--read)"></span>`;
    if(h.think)dots+=`<span class="dt" style="background:var(--think)"></span>`;
    if(pyStepsOf(h).length)dots+=`<span class="dt" style="background:var(--python)"></span>`;
    if(h.diet)dots+=`<span class="dt" style="background:var(--diet)"></span>`;
    if(h.gym)dots+=`<span class="dt" style="background:var(--gym)"></span>`;
    cells+=`<div class="cal-day ${future?"future":""} ${k===ymd(oggi)?"today":""}" data-day="${k}"><span>${g}</span><span class="dots">${dots}</span></div>`;
  }
  const leg=`<div class="cal-legend">
    <span><i style="background:var(--read)"></i>Lettura</span>
    <span><i style="background:var(--think)"></i>Ragionamento</span>
    <span><i style="background:var(--python)"></i>Python</span></div>`;
  return `<button class="resbtn" data-resoconto>Resoconto dell'anno</button>
    <div class="cal-head"><button class="cal-nav" data-cal="-1">&lsaquo;</button>
    <div class="cal-title">${titolo}</div>
    <button class="cal-nav" data-cal="1">&rsaquo;</button></div>
    <div class="cal-grid">${cells}</div>${leg}`;
}

function labelFuturo(d){
  const diff=Math.round((mezzanotte(d)-oggi)/86400000);
  if(diff===0)return "Oggi";
  if(diff===1)return "Domani";
  return cap(d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric"}));
}

function prossimiHTML(){
  let py="";

  if(start>=PYTHON.length){
    py=`<div class="up"><div class="what">Hai completato tutti i ${PYTHON.length} passi. Ora tocca a un progetto tutto tuo.</div></div>`;
  }else{
    const fine=Math.min(start+14,PYTHON.length);
    for(let i=start;i<fine;i++){
      py+=`<div class="up ${i===start?"next":""}"><div class="what"><div class="step">Passo ${i+1}${i===start?", il prossimo":""}</div>${PYTHON[i].t}</div></div>`;
    }
    const restano=PYTHON.length-fine;
    if(restano>0)py+=`<div class="remaining">e altri ${restano} passi fino al progetto finale</div>`;
  }
  let rag="",lett="";
  for(let i=1;i<=5;i++){

    lett+=`<div class="up"><div class="when">${labelFuturo(d)}</div><div class="what">${leggiPer(d)}</div></div>`;
  }
  return `<div class="sec-title">Percorso Python</div>${py}
    <div class="sec-title">Ragionamento</div>${rag}
    <div class="sec-title">Lettura</div>${lett}`;
}

function apriRecap(k){
  const d=new Date(k), h=stato.history[k]||{};
  const titolo=cap(d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}));
  const steps = pyStepsOf(h);
  const pyTxt = steps.length ? steps.map(s=>"Passo "+(s+1)+": "+PYTHON[s].t).join("<br>") : "Nessun passo registrato";
  const rows=[
    {cls:"read",lab:"Lettura",done:!!h.read,txt:leggiPer(d),extra:h.pages?("Pagine lette: "+h.pages):"",note:h.note},
    {cls:"think",lab:"Ragionamento",done:!!h.think,txt:ragionaPer(d)},
    {cls:"python",lab:"Python",done:steps.length>0,txt:pyTxt}
  ];
  const rowsHTML=rows.map(r=>`<div class="rc-row">
    <span class="rc-mark ${r.done?"on":""} ${r.cls}"></span>
    <div><div class="rc-lab ${r.cls}">${r.lab}${r.done?"":" (non fatto)"}</div>
    <div class="rc-txt">${r.txt}</div>
    ${r.extra?`<div class="rc-extra">${r.extra}</div>`:""}
    ${r.note?`<div class="rc-note">${esc(r.note)}</div>`:""}
    </div></div>`).join("");
  document.getElementById("modal").innerHTML=`<div class="overlay" id="ovl">
    <div class="sheet"><div class="sheet-head"><div class="t">${titolo}</div><button class="x" id="chiudi">&times;</button></div>
    ${rowsHTML}</div></div>`;
  document.getElementById("chiudi").addEventListener("click",chiudiRecap);
  document.getElementById("ovl").addEventListener("click",e=>{if(e.target.id==="ovl")chiudiRecap();});
}
function chiudiRecap(){document.getElementById("modal").innerHTML="";}

let resFiltro="tutto";
const RES_TRACCE=[["tutto","Tutto"],["read","Lettura"],["think","Ragionamento"],["python","Python"],["diet","Dieta"],["gym","Palestra"]];

function cellColor(k){
  const h=stato.history[k]; if(!h)return "";
  if(resFiltro==="tutto"){
    const n=(h.read?1:0)+(h.think?1:0)+(pyStepsOf(h).length?1:0)+(h.diet?1:0)+(h.gym?1:0);
    if(!n)return "";
    return `rgba(225,177,90,${[0,.28,.46,.64,.82,1][Math.min(n,5)]})`;
  }
  const on = resFiltro==="python" ? pyStepsOf(h).length>0 : !!h[resFiltro];
  return on ? `var(--${resFiltro})` : "";
}

function apriResoconto(){renderResoconto();}
function grigliaAnno(y){
  const mesi=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  const fine=new Date(y,11,31);
  let d=new Date(y,0,1);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  let colonne="", etichette="", meseVisto=-1;
  while(d<=fine){
    let col="", meseCol=-1;
    for(let r=0;r<7;r++){
      const cur=new Date(d); cur.setDate(d.getDate()+r);
      const dentro=cur.getFullYear()===y, futuro=mezzanotte(cur)>oggi;
      let bg="transparent";
      if(dentro&&!futuro)bg=cellColor(ymd(cur))||"var(--bg3)";
      else if(dentro&&futuro)bg="var(--bg2)";
      col+=`<span class="cg-cell" style="background:${bg}"></span>`;
      if(dentro&&cur.getDate()<=7&&cur.getMonth()!==meseVisto)meseCol=cur.getMonth();
    }
    if(meseCol>=0){etichette+=`<span class="cg-m">${mesi[meseCol]}</span>`;meseVisto=meseCol;}
    else etichette+=`<span class="cg-m"></span>`;
    colonne+=`<div class="cg-col">${col}</div>`;
    d.setDate(d.getDate()+7);
  }
  return `<div class="anno"><div class="anno-tit">${y}</div>
    <div class="cg-scroll"><div class="cg-labels">${etichette}</div><div class="cg">${colonne}</div></div></div>`;
}
function renderResoconto(){
  const annoOggi=oggi.getFullYear();
  const anni=new Set([annoOggi]);
  for(const k in stato.history){ if(attivo(k)) anni.add(parseInt(k.slice(0,4),10)); }
  const lista=[...anni].filter(y=>y<=annoOggi).sort((a,b)=>b-a);
  const chips=RES_TRACCE.map(([id,lab])=>`<button class="chip ${resFiltro===id?"on":""}" data-resf="${id}">${lab}</button>`).join("");
  const leg = resFiltro==="tutto"
    ? `<div class="cg-leg">meno<span class="lg" style="background:var(--bg3)"></span><span class="lg" style="background:rgba(225,177,90,.46)"></span><span class="lg" style="background:rgba(225,177,90,.82)"></span><span class="lg" style="background:rgba(225,177,90,1)"></span>più</div>`
    : `<div class="cg-leg"><span class="lg" style="background:var(--bg3)"></span>non fatto<span class="lg" style="background:var(--${resFiltro})"></span>fatto</div>`;
  document.getElementById("modal").innerHTML=`<div class="overlay res" id="ovl"><div class="respage">
    <div class="sheet-head"><div class="t">Resoconto</div><button class="x" id="chiudi">&times;</button></div>
    <div class="chips">${chips}</div>
    ${leg}
    ${lista.map(grigliaAnno).join("")}
    </div></div>`;
  document.getElementById("chiudi").addEventListener("click",chiudiRecap);
  document.getElementById("ovl").addEventListener("click",e=>{if(e.target.id==="ovl")chiudiRecap();});
  document.querySelectorAll("[data-resf]").forEach(b=>b.addEventListener("click",()=>{resFiltro=b.dataset.resf;renderResoconto();}));
}

function trofeo(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M9 20h6M12 14v6M8 20h8"/></svg>`;}

function autoAltezza(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}
function fiamma(acceso){
  const c=acceso?"var(--gold)":"var(--muted)";
  return `<svg viewBox="0 0 24 26" fill="none"><path d="M12 1c3 5 6 7 6 12a6 6 0 0 1-12 0c0-2.5 1-4 2.5-5.5C8.5 12 10 14 12 14c-2-4 0-8 0-13z" fill="${c}"/></svg>`;
}

render();
</script>
</body>
